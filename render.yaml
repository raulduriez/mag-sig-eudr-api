services:
  - type: web
    name: mag-sig-eudr-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: WHISP_API_KEY
        sync: false
      - key: WHISP_ENDPOINT
        sync: false
